name: Deploy to Vercel

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  checks:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  # main goes straight to the live site.
  production:
    needs: checks
    if: github.ref == 'refs/heads/main'
    name: Deploy Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  # Any other branch gets a private preview URL to look at first.
  preview:
    needs: checks
    if: github.ref != 'refs/heads/main'
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Deploy preview
        run: |
          url=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "$url"
          {
            echo "### Preview ready"
            echo ""
            echo "$url"
            echo ""
            echo "Branch \`${GITHUB_REF_NAME}\` — not live. Merge to \`main\` to publish."
          } >> "$GITHUB_STEP_SUMMARY"
